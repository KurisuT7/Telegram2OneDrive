name: telegram2onedrive

services:
  bot:
    image: ${TELEGRAM2ONEDRIVE_IMAGE:-ghcr.io/kurisut7/telegram2onedrive:latest}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - rclone-config:/config/rclone
      - telegram-state:/home/telegram2onedrive/.local/state/telegram2onedrive
    security_opt:
      - no-new-privileges:true

volumes:
  rclone-config:
  telegram-state:
