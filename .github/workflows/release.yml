name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/kurisut7/telegram2onedrive

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Validate release source
        shell: bash
        run: |
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python scripts/build_release_bundle.py \
            --tag "$GITHUB_REF_NAME" \
            --output-dir "$RUNNER_TEMP/preflight"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Build and publish image
        id: image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ github.ref_name }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Inspect published image
        shell: bash
        run: |
          docker buildx imagetools inspect \
            "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
          docker pull "${IMAGE_NAME}@${{ steps.image.outputs.digest }}"
          test "$(docker image inspect --format '{{.Config.User}}' \
            "${IMAGE_NAME}@${{ steps.image.outputs.digest }}")" = "10001:10001"
          docker run --rm "${IMAGE_NAME}@${{ steps.image.outputs.digest }}" --version
          docker run --rm --entrypoint rclone \
            "${IMAGE_NAME}@${{ steps.image.outputs.digest }}" version
      - name: Build and inspect runtime bundle
        shell: bash
        run: |
          python scripts/build_release_bundle.py \
            --tag "$GITHUB_REF_NAME" \
            --image-ref "${IMAGE_NAME}@${{ steps.image.outputs.digest }}" \
            --output-dir dist
          sha256sum --check dist/SHA256SUMS
          mkdir "$RUNNER_TEMP/runtime-bundle"
          tar -xzf dist/telegram2onedrive.tar.gz \
            -C "$RUNNER_TEMP/runtime-bundle" --strip-components=1
          cp "$RUNNER_TEMP/runtime-bundle/.env.example" \
            "$RUNNER_TEMP/runtime-bundle/.env"
          docker compose \
            -f "$RUNNER_TEMP/runtime-bundle/compose.yaml" \
            --env-file "$RUNNER_TEMP/runtime-bundle/.env" \
            config --quiet
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/telegram2onedrive.tar.gz
          dist/SHA256SUMS
          --draft
          --generate-notes
          --title "Telegram2OneDrive $GITHUB_REF_NAME"
          --verify-tag
