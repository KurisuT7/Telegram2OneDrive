[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "telegram2onedrive"
version = "0.2.0"
description = "Transfer files from an allowlisted Telegram bot to categorized OneDrive folders."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["telegram", "onedrive", "rclone", "file-transfer", "telegram-bot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Communications :: Chat",
    "Topic :: System :: Archiving",
    "Typing :: Typed",
]
dependencies = [
    "python-dotenv>=1.2,<2",
    "python-telegram-bot>=22.8,<23",
]

[project.optional-dependencies]
mtproto = [
    "pyrogram>=2.0.106,<3; python_version < '3.14'",
]
dev = [
    "build>=1.2,<2",
    "mypy>=1.15,<3",
    "pip-audit>=2.9,<3",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.15,<1",
    "pyrogram>=2.0.106,<3; python_version < '3.14'",
    "twine>=6,<8",
]

[project.scripts]
telegram2onedrive = "telegram2onedrive.cli:main"

[project.urls]
Repository = "https://github.com/KurisuT7/Telegram2OneDrive"
Issues = "https://github.com/KurisuT7/Telegram2OneDrive/issues"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/deploy",
    "/Dockerfile",
    "/compose.yaml",
    "/compose.build.yaml",
    "/scripts",
    "/.dockerignore",
    "/.env.example",
    "/CHANGELOG.md",
    "/CONTRIBUTING.md",
    "/README.md",
    "/README.zh-CN.md",
    "/SECURITY.md",
    "/LICENSE",
]
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel]
packages = ["src/telegram2onedrive"]
core-metadata-version = "2.4"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S603"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
strict = true
pretty = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["telegram2onedrive"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
